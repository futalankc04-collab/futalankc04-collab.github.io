<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>CourseMatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --brand:#4f46e5; --brand-d:#4338ca; --brand-l:#eef2ff; --brand-ll:#f5f7ff;
    --accent:#0d9488; --accent-l:#e6fbf8;
    --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e5e9f2; --bg:#f4f6fb; --card:#fff;
    --ok:#059669; --ok-l:#ecfdf5; --warn:#b45309; --warn-l:#fffbeb; --bad:#dc2626; --bad-l:#fef2f2;
    --r:16px; --r-sm:10px;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 6px 20px rgba(15,23,42,.06);
    --shadow-lg:0 10px 40px rgba(15,23,42,.14);
    --grad:linear-gradient(135deg,#4f46e5 0%,#6d5df6 45%,#0d9488 100%);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif; font-size:15px; line-height:1.5;
         color:var(--ink); background:var(--bg); }
  a { color:var(--brand); text-decoration:none; font-weight:600; cursor:pointer; }
  a:hover { text-decoration:underline; }
  svg.i { width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; }

  /* ---------- header + navigation ---------- */
  .top { position:sticky; top:0; z-index:30; background:rgba(255,255,255,.88); backdrop-filter:saturate(1.6) blur(14px);
         -webkit-backdrop-filter:saturate(1.6) blur(14px); border-bottom:1px solid var(--line); }
  .top-in { max-width:1080px; margin:0 auto; display:flex; align-items:center; gap:14px; padding:10px 18px; min-height:60px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; letter-spacing:-.02em; color:var(--ink); white-space:nowrap; }
  .logo { width:34px; height:34px; border-radius:10px; background:var(--grad); display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 4px 12px rgba(79,70,229,.35); }
  .logo svg { width:20px; height:20px; stroke:#fff; }
  .nav { display:flex; gap:4px; flex:1; justify-content:center; }
  .nav a { display:flex; align-items:center; gap:7px; color:var(--ink2); padding:8px 14px; border-radius:999px; font-size:14px; font-weight:600; position:relative; }
  .nav a:hover { background:var(--brand-ll); text-decoration:none; }
  .nav a.on { background:var(--brand-l); color:var(--brand-d); }
  .nav a svg.i { width:18px; height:18px; }
  .dot { position:absolute; top:3px; right:6px; min-width:17px; height:17px; line-height:17px; text-align:center; border-radius:9px; background:var(--bad); color:#fff; font-size:10px; font-weight:800; padding:0 4px; border:2px solid #fff; }
  .me { position:relative; }
  .me-btn { display:flex; align-items:center; gap:8px; background:none; border:1px solid var(--line); color:var(--ink); padding:4px 10px 4px 4px; border-radius:999px; font-weight:600; }
  .me-btn:hover { background:var(--brand-ll); }
  .me-name { max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
  .menu { position:absolute; right:0; top:calc(100% + 8px); background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-lg); min-width:220px; padding:6px; z-index:40; }
  .menu .mh { padding:10px 12px; border-bottom:1px solid var(--line); margin-bottom:4px; }
  .menu a { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; color:var(--ink2); font-weight:600; font-size:14px; }
  .menu a:hover { background:var(--brand-ll); text-decoration:none; }
  .tabs-bottom { display:none; }

  /* ---------- layout ---------- */
  main { max-width:1080px; margin:0 auto; padding:24px 18px 48px; }
  h1 { font-size:26px; line-height:1.2; letter-spacing:-.02em; margin:4px 0 6px; }
  h2 { font-size:18px; letter-spacing:-.01em; margin:26px 0 12px; } h3 { font-size:15px; margin:14px 0 8px; }
  .sub { color:var(--muted); margin:0 0 18px; }
  .head { display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:6px; } .head > div:first-child { flex:1; min-width:220px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
  .card h2:first-child, .card h3:first-child { margin-top:0; }
  .note { display:flex; gap:10px; background:var(--warn-l); border:1px solid #fde68a; color:#78350f; border-radius:var(--r-sm); padding:12px 14px; font-size:13.5px; margin:12px 0 16px; }
  .note.info { background:var(--brand-ll); border-color:#dfe3ff; color:#312e81; }
  .muted { color:var(--muted); } .small { font-size:13px; } .tiny { font-size:12px; }
  .err { color:var(--bad); font-size:13.5px; min-height:20px; margin-top:10px; font-weight:500; } .okmsg { color:var(--ok); font-size:13.5px; margin-top:10px; font-weight:600; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:0 16px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; align-items:center; }
  .hidden { display:none !important; }

  /* ---------- controls ---------- */
  button, .btn { font-family:inherit; font-size:14px; border-radius:12px; padding:10px 18px; cursor:pointer; border:1px solid var(--brand); background:var(--brand);
                 color:#fff; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:8px; line-height:1.2; transition:background .15s, transform .05s; text-decoration:none !important; }
  button:hover, .btn:hover { background:var(--brand-d); } button:active, .btn:active { transform:scale(.98); }
  button.sec, .btn.sec { background:#fff; color:var(--ink); border-color:var(--line); } button.sec:hover, .btn.sec:hover { background:var(--brand-ll); }
  button.ghost, .btn.ghost { background:var(--brand-ll); color:var(--brand-d); border-color:transparent; } button.ghost:hover, .btn.ghost:hover { background:var(--brand-l); }
  button.danger { background:#fff; color:var(--bad); border-color:#fecaca; } button.danger:hover { background:var(--bad-l); }
  button.big, .btn.big { padding:14px 20px; font-size:15px; border-radius:14px; width:100%; }
  button.sm, .btn.sm { padding:7px 12px; font-size:13px; border-radius:10px; }
  button.link { background:none; border:none; color:var(--brand); padding:4px; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .face-btn { background:var(--grad); border:none; box-shadow:0 8px 24px rgba(79,70,229,.35); } .face-btn:hover { filter:brightness(1.05); background:var(--grad); }
  label { display:block; font-size:13.5px; font-weight:600; margin:14px 0 6px; color:var(--ink2); }
  input, select, textarea { width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; font-size:15px; font-family:inherit; background:#fff; color:var(--ink); transition:border .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 4px rgba(79,70,229,.12); }
  textarea { min-height:96px; resize:vertical; }
  .pw { position:relative; } .pw input { padding-right:64px; } .pw button { position:absolute; right:6px; top:50%; transform:translateY(-50%); }

  /* ---------- sign in ---------- */
  .auth-wrap { min-height:calc(100vh - 140px); display:grid; grid-template-columns:1.05fr 1fr; gap:28px; align-items:center; max-width:980px; margin:0 auto; }
  .auth-hero { background:var(--grad); color:#fff; border-radius:24px; padding:40px 36px; position:relative; overflow:hidden; box-shadow:var(--shadow-lg); }
  .auth-hero:after { content:''; position:absolute; width:320px; height:320px; right:-110px; bottom:-130px; border-radius:50%; background:rgba(255,255,255,.12); }
  .auth-hero h1 { font-size:34px; margin:18px 0 10px; } .auth-hero p { opacity:.92; margin:0 0 18px; font-size:15.5px; }
  .auth-hero ul { list-style:none; padding:0; margin:0; } .auth-hero li { display:flex; gap:10px; align-items:center; margin:10px 0; font-weight:600; }
  .auth-hero li span { width:30px; height:30px; border-radius:9px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; }
  .auth-hero li svg.i { stroke:#fff; width:17px; height:17px; }
  .auth-card { padding:28px; }
  .seg { display:flex; background:var(--bg); border-radius:12px; padding:4px; margin:4px 0 6px; }
  .seg button { flex:1; background:transparent; color:var(--muted); border:none; padding:9px; border-radius:9px; }
  .seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(15,23,42,.1); }
  .or { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; font-weight:600; margin:18px 0 4px; }
  .or:before, .or:after { content:''; flex:1; height:1px; background:var(--line); }
  .welcome { text-align:center; padding:8px 0 4px; }
  .face-ico { width:84px; height:84px; margin:6px auto 14px; border-radius:26px; background:var(--brand-l); display:flex; align-items:center; justify-content:center; color:var(--brand); }
  .face-ico svg.i { width:46px; height:46px; stroke-width:1.6; }

  /* ---------- camera selfie scan (face recognition circle) ---------- */
  .fr-card { max-width:440px; margin:0 auto; background:#fff; border-radius:24px; box-shadow:var(--shadow-lg); overflow:hidden; text-align:center; }
  .fr-bar { display:flex; align-items:center; gap:10px; background:#1d4ed8; color:#fff; padding:14px 16px; font-weight:700; font-size:16px; text-align:left; }
  .fr-bar a { color:#fff; display:flex; } .fr-bar svg.i { stroke:#fff; }
  .fr-body { padding:26px 22px 22px; }
  .fr-body h1 { font-size:21px; margin:0 0 4px; } .fr-body .sub { margin:0 0 18px; font-size:14px; }
  .scan-wrap { --p:0; width:250px; height:250px; margin:0 auto 18px; padding:7px; border-radius:50%;
               background:conic-gradient(#1d4ed8 calc(var(--p) * 1%), #dbeafe 0); box-shadow:0 10px 30px rgba(29,78,216,.18); }
  .scan { position:relative; width:100%; height:100%; border-radius:50%; overflow:hidden; background:#eef2ff; border:5px solid #fff;
          -webkit-mask-image:-webkit-radial-gradient(white, black); }
  .scan video { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); display:block; background:#eef2ff; }
  .scan-line { position:absolute; left:12%; right:12%; height:2px; top:18%; border-radius:2px; background:linear-gradient(90deg,transparent,#60a5fa,transparent);
               box-shadow:0 0 10px #60a5fa; animation:scanline 2.4s ease-in-out infinite; }
  @keyframes scanline { 0%, 100% { top:18%; } 50% { top:80%; } }
  .scan-idle { position:absolute; top:0; right:0; bottom:0; left:0; display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:center; color:#1d4ed8; font-size:13px; font-weight:600; }
  .scan-idle svg.i { width:84px; height:84px; stroke-width:1.2; }
  .scan-check { position:absolute; top:0; right:0; bottom:0; left:0; display:flex; align-items:center; justify-content:center; background:rgba(5,150,105,.82); animation:fade .25s; }
  .check-anim { width:110px; height:110px; }
  .check-anim circle { fill:none; stroke:#fff; stroke-width:5; stroke-dasharray:302; stroke-dashoffset:302; animation:draw .5s ease-out forwards; }
  .check-anim path { fill:none; stroke:#fff; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:80; stroke-dashoffset:80; animation:draw .35s .45s ease-out forwards; }
  .check-anim.green circle { stroke:var(--ok); } .check-anim.green path { stroke:var(--ok); }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .fr-tip { font-size:14.5px; color:var(--ink2); margin:0 0 6px; }
  .scan-msg { font-weight:700; font-size:16px; min-height:24px; color:#1d4ed8; margin-bottom:16px; }
  .scan-msg.warn { color:var(--warn); }
  .fr-btn { width:100%; border-radius:999px; background:#1d4ed8; border-color:#1d4ed8; padding:14px 20px; font-size:15px; }
  .fr-btn:hover { background:#1e40af; }
  .fr-foot { font-size:12.5px; color:var(--muted); margin-top:14px; }
  .verified-card { display:flex; align-items:center; gap:14px; text-align:left; background:var(--ok-l); border:1px solid #a7f3d0; border-radius:16px; padding:14px; margin:14px 0 6px; }
  .verified-card .nm { font-weight:800; font-size:17px; } .verified-card .sm { font-size:13px; color:var(--ink2); }
  .vpill { display:inline-flex; align-items:center; gap:5px; background:var(--ok); color:#fff; font-size:12px; font-weight:800; padding:3px 10px; border-radius:999px; }
  .vpill svg.i { width:14px; height:14px; stroke-width:3; }
  .hero .vpill { background:rgba(255,255,255,.22); }
  .hero .who { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; font-size:13px; opacity:.95; margin:0 0 12px; }
  @media (max-width: 760px) { .scan-wrap { width:230px; height:230px; } .fr-card { border-radius:20px; } }

  /* ---------- "Login Authentication" page: full screen, blue header, face circle ---------- */
  .fa-page { position:fixed; top:0; right:0; bottom:0; left:0; z-index:45; background:#fff; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; }
  .fa-bar { position:relative; flex:none; background:#2563eb; color:#fff; text-align:center; font-weight:700; font-size:22px; letter-spacing:-.01em;
            padding:calc(18px + env(safe-area-inset-top)) 56px 18px; }
  .fa-bar a { position:absolute; left:10px; bottom:13px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:50%; color:#fff; }
  .fa-bar a:hover { background:rgba(255,255,255,.15); text-decoration:none; }
  .fa-bar svg.i { stroke:#fff; }
  .fa-body { flex:1; width:100%; max-width:460px; margin:0 auto; padding:40px 22px calc(24px + env(safe-area-inset-bottom)); text-align:center; }
  .fa-page #fsBody { width:100%; }
  .fa-page .scan-msg { font-size:19px; font-weight:500; color:var(--ink); min-height:28px; margin:0 0 26px; }
  .fa-page .scan-msg.warn { color:#b45309; font-weight:600; }
  .fa-page .scan-wrap { width:min(76vw, 300px); height:min(76vw, 300px); padding:7px; margin:0 auto 40px;
                        background:#1d4ed8; box-shadow:none; }
  .fa-page .scan { border:6px solid #fff; background:#e8eefc; }
  .fa-page .scan-line { display:none !important; }
  .scan-grid { position:absolute; top:0; right:0; bottom:0; left:0; pointer-events:none;
    background:
      linear-gradient(to right, transparent calc(33.33% - 1px), rgba(255,255,255,.6) calc(33.33% - 1px), rgba(255,255,255,.6) 33.33%, transparent 33.33%,
                      transparent calc(66.66% - 1px), rgba(255,255,255,.6) calc(66.66% - 1px), rgba(255,255,255,.6) 66.66%, transparent 66.66%),
      linear-gradient(to bottom, transparent calc(33.33% - 1px), rgba(255,255,255,.6) calc(33.33% - 1px), rgba(255,255,255,.6) 33.33%, transparent 33.33%,
                      transparent calc(66.66% - 1px), rgba(255,255,255,.6) calc(66.66% - 1px), rgba(255,255,255,.6) 66.66%, transparent 66.66%); }
  .fa-tips { font-size:15px; line-height:1.65; color:var(--ink2); margin:0 0 22px; }
  .fa-page .fr-btn { max-width:320px; margin:0 auto; background:#2563eb; border-color:#2563eb; }
  .fa-foot { font-size:12.5px; color:var(--muted); margin:18px 0 0; }
  .fa-page .note { text-align:left; }

  /* ---------- home ---------- */
  .hero { background:var(--grad); color:#fff; border-radius:22px; padding:24px; display:flex; align-items:center; gap:22px; box-shadow:var(--shadow-lg); margin-bottom:18px; position:relative; overflow:hidden; }
  .hero:after { content:''; position:absolute; width:260px; height:260px; right:-80px; top:-120px; border-radius:50%; background:rgba(255,255,255,.1); }
  .hero h1 { color:#fff; margin:0 0 4px; } .hero p { margin:0 0 14px; opacity:.92; }
  .hero .btn { background:#fff; color:var(--brand-d); border-color:#fff; } .hero .btn:hover { background:#eef2ff; }
  .ring { width:104px; height:104px; flex:none; position:relative; z-index:1; }
  .ring svg { width:104px; height:104px; transform:rotate(-90deg); }
  .ring .lbl { position:absolute; top:0; right:0; bottom:0; left:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800; font-size:24px; line-height:1; }
  .ring .lbl small { font-size:11px; font-weight:600; opacity:.85; margin-top:4px; }
  .steps-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .step { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; cursor:pointer; box-shadow:var(--shadow); transition:transform .1s, border-color .15s; }
  .step:hover { border-color:#c7cdfc; transform:translateY(-1px); }
  .step .ic { width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:var(--brand-l); color:var(--brand); flex:none; }
  .step.done .ic { background:var(--ok-l); color:var(--ok); }
  .step .t { font-weight:700; } .step .s { font-size:12.5px; color:var(--muted); }
  .step.done .s { color:var(--ok); font-weight:600; }

  /* ---------- chips, pills, badges ---------- */
  .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-size:12.5px; font-weight:700; background:#eef1f6; color:var(--ink2); }
  .pill.Endorsed { background:var(--ok-l); color:var(--ok); } .pill.Needs { background:var(--warn-l); color:var(--warn); } .pill.Pending { background:#eef1f6; color:var(--muted); }
  .badge { display:inline-block; border-radius:999px; padding:2px 9px; font-size:11.5px; font-weight:700; }
  .b-High { color:var(--ok); background:var(--ok-l); } .b-Moderate { color:var(--warn); background:var(--warn-l); } .b-Low { color:var(--bad); background:var(--bad-l); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-block; background:#f1f4f9; color:var(--ink2); border-radius:8px; padding:3px 8px; font-size:11.5px; font-weight:600; }
  .chip.hl { background:var(--brand); color:#fff; }
  .chip.near { background:var(--accent-l); color:var(--accent); }
  .pick { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 12px; }
  .pick button { background:#fff; color:var(--ink2); border:1.5px solid var(--line); padding:8px 14px; border-radius:999px; font-size:13px; }
  .pick button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .pick button .star { color:#f59e0b; }
  .pick button.on .star { color:#fde68a; }

  /* ---------- recommendation cards ---------- */
  .rec { position:relative; padding-top:22px; }
  .rec-top { display:flex; align-items:center; gap:14px; }
  .rank { width:42px; height:42px; border-radius:13px; background:var(--brand-l); color:var(--brand-d); font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; font-size:16px; }
  .rec:first-of-type .rank, .rank.gold { background:linear-gradient(135deg,#f59e0b,#f97316); color:#fff; }
  .rec-top .t { flex:1; font-weight:800; font-size:17px; letter-spacing:-.01em; } .rec-top .t small { display:block; font-weight:600; font-size:12.5px; color:var(--muted); letter-spacing:0; }
  .score { text-align:right; } .score b { font-size:28px; font-weight:800; line-height:1; color:var(--brand-d); } .score small { display:block; font-size:11px; color:var(--muted); font-weight:600; }
  .bar { height:8px; background:#edf0f6; border-radius:999px; overflow:hidden; margin:14px 0; } .bar > div { height:100%; border-radius:999px; background:var(--grad); }
  .tiles { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .tile { background:var(--bg); border-radius:12px; padding:10px; font-size:12px; color:var(--ink2); }
  .tile .v { font-weight:800; font-size:15px; color:var(--ink); margin-left:4px; }
  ul.reasons { margin:14px 0 6px; padding:0; list-style:none; } ul.reasons li { display:flex; gap:8px; margin:6px 0; font-size:14px; }
  ul.reasons li:before { content:'✓'; color:var(--ok); font-weight:800; }
  .persist { font-size:12.5px; color:var(--muted); background:var(--bg); border-radius:10px; padding:10px 12px; margin:10px 0 4px; }
  .endorsed { border:2px solid #a7f3d0; background:linear-gradient(180deg,#f0fdf9,#fff 120px); }
  .endorsed .tag { display:inline-flex; align-items:center; gap:6px; background:var(--ok); color:#fff; font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px; margin-bottom:8px; }
  .allrow { display:grid; grid-template-columns:1.2fr 1fr 44px; gap:12px; align-items:center; padding:9px 2px; border-bottom:1px solid var(--line); font-size:14px; }
  .allrow:last-child { border-bottom:0; } .allrow .bar { margin:0; }

  /* ---------- schools ---------- */
  .locbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin:6px 0 16px; box-shadow:var(--shadow); }

/** Reads the chosen picture, crops it to a square, and shrinks it so it fits in one spreadsheet cell. */
function pickPhoto(input) {
  var file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  if (!/^image\//.test(file.type)) return setErr('Please choose a picture file (JPG or PNG).', 'photoErr');
  if (file.size > 15 * 1024 * 1024) return setErr('That picture is bigger than 15 MB. Please choose a smaller one.', 'photoErr');
  busy(true);
  var reader = new FileReader();
  reader.onerror = function () { busy(false); setErr('Could not read that picture. Please try another one.', 'photoErr'); };
  reader.onload = function () {
    var img = new Image();
    img.onerror = function () { busy(false); setErr('This picture type is not supported here. Please use a JPG or PNG (on iPhone, take a screenshot of the photo and upload that).', 'photoErr'); };
    img.onload = function () {
      try {
        var side = Math.min(img.naturalWidth, img.naturalHeight);
        var sx = (img.naturalWidth - side) / 2, sy = (img.naturalHeight - side) / 2;
        var data = '', sizes = [256, 200, 160, 128], q = 0.85;
        for (var i = 0; i < sizes.length && (!data || data.length > PHOTO_MAX); i++) {
          var c = document.createElement('canvas'); c.width = c.height = sizes[i];
          var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, sizes[i], sizes[i]);
          ctx.drawImage(img, sx, sy, side, side, 0, 0, sizes[i], sizes[i]);
          for (q = 0.85; q >= 0.5; q -= 0.1) { data = c.toDataURL('image/jpeg', q); if (data.length <= PHOTO_MAX) break; }
        }
        if (!data || data.length > PHOTO_MAX) { busy(false); return setErr('Could not make the picture small enough. Please try another one.', 'photoErr'); }
        api('savePhoto', { photo: data }).then(function (r) { busy(false); PHOTO = r.photo; drawTop(); go(PAGE); })
          .catch(function (e) { fail(e, 'photoErr'); });
      } catch (e) { busy(false); setErr('Could not process the picture. Please try another one.', 'photoErr'); }
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function removePhoto() {
  if (!confirm('Remove your profile picture?')) return;

// ------------------------------------------------------------ question helpers
function progressBar(id, total) {
  return '<div class="progress-sticky"><div class="row"><span>Your progress</span><span id="' + id + '_n">0 of ' + total + ' answered</span></div>' +
    '<div class="bar" style="margin:0"><div id="' + id + '_b" style="width:0%"></div></div></div>';
}
function updateProgress(prefix, total, id) {
  var n = 0; for (var i = 0; i < total; i++) if (document.querySelector('input[name="' + prefix + i + '"]:checked')) n++;
  var t = $(id + '_n'), b = $(id + '_b');
  if (t) t.textContent = n + ' of ' + total + ' answered'; if (b) b.style.width = Math.round(n / total * 100) + '%';
}
function optHtml(name, j, text, on) {
  return '<label class="opt' + (on ? ' sel' : '') + '" onclick="markSel(this)"><input type="radio" name="' + name + '" value="' + j + '"' + (on ? ' checked' : '') + '>' +
    '<span class="L">' + LETTERS[j] + '</span><span>' + esc(text) + '</span></label>';
}
function markSel(lbl) {
  var group = lbl.parentNode.querySelectorAll('.opt');
  for (var i = 0; i < group.length; i++) group[i].classList.remove('sel');
  lbl.classList.add('sel');
  var input = lbl.querySelector('input'); if (input) input.checked = true;
  if (markSel.after) markSel.after();
}
function radioVal(name) { var el = document.querySelector('input[name="' + name + '"]:checked'); return el ? Number(el.value) : null; }
function firstMissing(answers, prefix) {
  var m = answers.indexOf(null);
  if (m !== -1) { var el = document.querySelector('input[name="' + prefix + m + '"]'); if (el) el.closest('.q').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  return m;
}

      (ex.takenAt ? ' on ' + esc(fmtDay(ex.takenAt)) : '') + '.</p>' +
      '<div style="overflow-x:auto"><table><tr><th>Area</th><th></th><th>Score</th><th class="hide-m">' + esc(ex.ncaeSource || 'NCAE/PACT') + ' percentile</th></tr>' + rows + '</table></div>' +
      '<div class="actions"><button class="sec" onclick="pExam(true)">' + icon('refresh') + 'Retake the examination</button></div></div>');
    return;
  }

    return '<div class="q"><div class="meta">' + (i + 1) + ' of ' + total + ' · ' + esc(q.area) + '</div><div class="stem">' + esc(q.q) + '</div>' +
      q.c.map(function (c, j) { return optHtml('ex' + i, j, c, false); }).join('') + '</div>';
  }).join('');
  render(stepHead('Examination', 'Answer on your own. There is no time limit. Your scores show which areas are your strengths.') + progressBar('exP', total) + qs +
    '<div class="card"><h2>Official results <span class="muted" style="font-weight:500">(optional)</span></h2><p class="small muted" style="margin-top:-6px">If you took the NCAE or a CEM test such as PACT, ' +
    'type the percentile ranks from your certificate. Your counselor will check them.</p>' +
    '<label for="ncaeSrc">Source</label><select id="ncaeSrc"><option value="">I have no official result</option><option>NCAE</option><option>CEM-PACT</option></select>' +
    '<div class="grid2">' + CFG.ncaeFields.map(function (f) {
      return '<div><label for="n_' + f.key + '">' + esc(f.label) + '</label><input id="n_' + f.key + '" type="number" inputmode="numeric" min="1" max="99" placeholder="1–99"></div>';
    }).join('') + '</div>' +
    '<div id="err" class="err"></div><div class="actions"><button onclick="submitExam()">Submit examination</button>' +
    (ex ? '<button class="sec" onclick="pExam()">Cancel</button>' : '') + '</div></div>');
  markSel.after = function () { updateProgress('ex', total, 'exP'); };
}
function submitExam() {
  var answers = CFG.exam.map(function (q, i) { return radioVal('ex' + i); });
  var missing = firstMissing(answers, 'ex');
  if (missing !== -1) return setErr('Please answer question ' + (missing + 1) + '.');
  var src = val('ncaeSrc'), ncae = {}, bad = '';
  if (src) CFG.ncaeFields.forEach(function (f) {
    var v = val('n_' + f.key); if (v === '') return;
    var n = Number(v); if (isNaN(n) || n < 1 || n > 99) bad = 'Percentile ranks must be from 1 to 99.'; ncae[f.key] = n;
  });
  if (bad) return setErr(bad);
  busy(true, 'Checking your answers…');
  api('submitExam', { answers: answers, ncaeSource: src, ncae: ncae }).then(function (r) { REC = r; busy(false); pExam(); toast('Examination submitted ✓'); }).catch(function (e) { fail(e); });
}

// ------------------------------------------------------------ recommendations (shared by student + counselor)
function recCards(res, o, keyPrefix, endorsement) {
  var w = res.weights;
  var keys = ['grades', 'exam', 'skills', 'interests', 'preference'];
  var cards = res.top.map(function (p, i) {
    var tiles = keys.map(function (k) {
      var t = p.tiles[k];
      return '<div class="tile"><div>' + esc(CFG.weightLabels[k]) + '</div><div style="margin:4px 0 2px"><span class="badge b-' + t.level + '">' + t.level +
        '</span><span class="v">' + t.score + '</span></div><div class="tiny muted">adds ' + t.points + ' pts</div></div>';
    }).join('');
    var pe = p.persistence;
    var persist = pe ? '<div class="persist">Historical persistence estimate (AI model): <span class="badge b-' + pe.level + '">' + pe.level + '</span> p = ' + pe.p +
      ' · based on ' + pe.n + ' past students' + (res.demoModel ? ' (sample data)' : '') + ' · main factors: ' +
      pe.factors.map(function (f) { return esc(f.name) + ' (' + signed(f.effect) + ')'; }).join(', ') +
      '. This describes past patterns, not causes, and does not change the ranking.</div>'
      : '<div class="persist">Historical persistence estimate (AI model): not enough past student data for this program yet.</div>';
    var isEnd = endorsement && endorsement.status === 'Endorsed' && endorsement.program === p.code;
    var n = schoolsFor(p.code, o).length;
    return '<div class="card rec' + (isEnd ? ' endorsed' : '') + '">' + (isEnd ? '<div class="tag">' + icon('check') + ' Endorsed course</div>' : '') +
      '<div class="rec-top"><div class="rank' + (i === 0 ? ' gold' : '') + '">' + (i + 1) + '</div><div class="t">' + esc(p.name) + '<small>' + esc(p.code) + '</small></div>' +
      '<div class="score"><b>' + p.total + '</b><small>out of 100</small></div></div>' +
      '<div class="bar"><div style="width:' + Math.min(100, p.total) + '%"></div></div><div class="tiles">' + tiles + '</div>' +
      (p.reasons.length ? '<ul class="reasons">' + p.reasons.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>' : '') + persist +
      '<h3>' + n + ' school' + (n === 1 ? '' : 's') + ' offer this course · nearest first</h3>' + schoolList(p.code, o, keyPrefix + p.code, 3) + '</div>';
  }).join('');
  var all = res.all.map(function (p) {
    return '<div class="allrow"><div>' + esc(p.name) + '</div><div class="bar"><div style="width:' + Math.min(100, p.total) + '%"></div></div><div><b>' + p.total + '</b></div></div>';
  }).join('');
  var endInTop = endorsement && endorsement.status === 'Endorsed' && res.top.some(function (p) { return p.code === endorsement.program; });
  return '<div class="small muted">Generated ' + esc(fmtDate(res.generatedAt)) + ' · Weights: ' +
    keys.map(function (k) { return esc(CFG.weightLabels[k]) + ' ' + w[k]; }).join(', ') + '</div>' +
    (endorsement && endorsement.status === 'Endorsed' && !endInTop ? '<h2>Endorsed course</h2>' + endorsedCard(endorsement, o, keyPrefix + 'end', 3) : '') +
    '<h2>Your top 5 courses</h2>' + cards +
    '<h2>All programs</h2><div class="card">' + all + '</div>';
}

  var r = REC.recommendation, o = myOrigin();

function downloadPdf(userId) {
  busy(true, 'Making your PDF…');
  api('reportPdf', userId ? { userId: userId } : {}).then(function (f) {
    busy(false);
    try {
      var bin = atob(f.base64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      var a = document.createElement('a'); a.href = url; a.download = f.filename; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
      toast('Your PDF is downloading.');
    } catch (e) { setErr('Download is blocked on this device. Use Print and choose “Save as PDF”.'); }
  }).catch(function (e) { fail(e); });
}

  if (b.length < 3) return setErr('Please enter the message.');
  busy(true);
  api('postAnnouncement', { title: t, body: b }).then(function () { busy(false); pNews(); toast('Posted ✓'); }).catch(function (e) { fail(e); });
}
function delNews(id) {
  if (!confirm('Delete this announcement?')) return;
  busy(true);
  api('deleteAnnouncement', { id: id }).then(function () { busy(false); pNews(); }).catch(function (e) { fail(e); });
}

// ------------------------------------------------------------ account: face sign-in + password
function faceCard() {
  var support = '<p class="small muted">Works with Face ID or Touch ID on iPhone and iPad, face or fingerprint unlock on Android phones (Samsung, Xiaomi, Oppo, vivo, realme, Huawei and others), ' +
    'Windows Hello on Windows laptops (face, fingerprint, or PIN), and Touch ID on MacBooks. If a device has no face or fingerprint unlock, it uses the screen lock PIN instead. ' +
    'Your face and fingerprint stay on your device; CourseMatch never receives them.</p>';
  if (!CFG.appUrl) return '<div class="card"><h2>' + icon('face') + ' Biometric verification</h2><p class="muted">Not turned on for CourseMatch yet. Ask your administrator.</p>' + support + '</div>';
  if (!FACE.here) return '<div class="card"><h2>' + icon('face') + ' Biometric verification</h2><p>To use your face or fingerprint, open CourseMatch from its app link, sign in, and turn it on there.</p>' +
    '<a class="btn" href="' + esc(CFG.appUrl) + '" target="_top">' + icon('arrow') + 'Open the CourseMatch app</a>' + support + '</div>';
  return '<div class="card"><h2>' + icon('face') + ' Biometric verification</h2><p class="small muted" style="margin-top:-6px">Asked at every sign-in, and again after ' + LOCK_MINUTES + ' minutes away from the app. These devices can verify you:</p><div id="devList" class="muted small">Loading your devices…</div>' +
    (FACE.api ? '<div class="actions">' + (faceOnHere() ? '<span class="pill Endorsed">' + icon('check') + ' On for this device</span>' :
      '<button id="faceSetupBtn" class="face-btn" disabled onclick="faceSetup(drawDevices)">' + bioIcon() + 'Turn on ' + esc(FACE.label) + ' for this device</button>') + '</div>' :
      '<p class="err">This browser does not support face or fingerprint sign-in. Try Chrome, Safari, Edge or Samsung Internet.</p>') + support + '</div>';
}
function faceScanCard() {
  var head = '<div class="card"><h2>' + icon('face') + ' Camera face scan</h2>';
  if (!FACE.here) return head + '<p>The face scan works in the CourseMatch app. Open it from its app link.</p>' +
    (CFG.appUrl ? '<a class="btn" href="' + esc(CFG.appUrl) + '" target="_top">' + icon('arrow') + 'Open the CourseMatch app</a>' : '') + '</div>';
  return head + '<p class="small muted" style="margin-top:-6px">Your selfie scan is checked at every sign-in. Works with the front camera of Android phones, iPhone and iPad, ' +
    'and the webcam of any laptop (Windows, Mac, Chromebook). Only a face print (numbers) is saved, never your picture.</p>' +
    '<div class="actions">' + (FS.enrolled ? '<span class="pill Endorsed">' + icon('check') + ' Face scan saved</span>' : '<span class="pill Pending">Not set up</span>') +
    (camSupported() ? '<button class="face-btn" onclick="rescanFace()">' + icon('face') + (FS.enrolled ? 'Scan my face again' : 'Set up face scan') + '</button>'
      : '<span class="err" style="margin:0">This browser cannot open the camera.</span>') + '</div></div>';
}
function drawDevices(list) {
  var el = $('devList'); if (!el) return;
  var mine = loadJson('cm_face');
  el.className = '';
  el.innerHTML = list.length ? list.map(function (d) {
    var thisOne = mine && mine.credId === d.id;
    return '<div class="device"><div class="ic">' + icon(/Windows|Mac|Computer/.test(d.device) ? 'laptop' : 'phone') + '</div><div class="t"><b>' + esc(d.device) + (thisOne ? ' <span class="chip near">This device</span>' : '') + '</b>' +
      '<span class="small muted">Added ' + esc(fmtDay(d.createdAt)) + (d.lastUsedAt ? ' · last used ' + esc(fmtDay(d.lastUsedAt)) : '') + '</span></div>' +
      '<button class="danger sm" onclick="removeDevice(\'' + esc(d.id) + '\')">Remove</button></div>';
  }).join('') : '<p class="muted small" style="margin:0">No devices yet.</p>';
}
function removeDevice(id) {
  if (!confirm('Remove face sign-in for this device? You can still sign in with your password.')) return;
  busy(true);
  api('passkeyRemove', { id: id }).then(function (list) {
    busy(false); var mine = loadJson('cm_face'); if (mine && mine.credId === id) store('cm_face', null);
    pPassword(); toast('Device removed.');
  }).catch(function (e) { fail(e); });
}
function emailCard() {
  return '<div class="card" style="max-width:520px"><h2>✉️ Email for password reset</h2>' +
    (EMAIL ? '<p style="margin-top:-4px">Current email: <b>' + esc(EMAIL) + '</b></p>' : '<div class="note">' + icon('shield') + '<div>Add an email so you can reset your password if you forget it.</div></div>') +
    '<label for="em_new">' + (EMAIL ? 'New email' : 'Email address') + '</label><input id="em_new" type="email" autocomplete="email" autocapitalize="none" placeholder="you@example.com">' +
    '<label for="em_pw">Your password</label><input id="em_pw" type="password" autocomplete="current-password">' +
    '<div id="emErr" class="err"></div><div class="actions"><button onclick="saveEmail()">Save email</button></div></div>';
}
function saveEmail() {
  var e = val('em_new'), p = $('em_pw').value;
  if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(e)) return setErr('Please enter a valid email address.', 'emErr');
  if (!p) return setErr('Please enter your password.', 'emErr');
  busy(true);
  api('setEmail', { email: e, password: p }).then(function (r) { busy(false); EMAIL = r.email; pPassword(); toast('Email saved ✓'); }).catch(function (x) { fail(x, 'emErr'); });
}
function pPassword() {
  render('<h1>Account & sign-in</h1><p class="sub">Manage your picture, face sign-in, email, and password.</p>' + photoCard() + faceScanCard() + emailCard() +
    '<div class="card" style="max-width:520px"><h2>' + icon('lock') + ' Change password</h2><label for="pw_o">Current password</label><input id="pw_o" type="password" autocomplete="current-password">' +
    '<label for="pw_n">New password</label><input id="pw_n" type="password" autocomplete="new-password">' +
    '<label for="pw_c">Type the new password again</label><input id="pw_c" type="password" autocomplete="new-password">' +
    '<div id="err" class="err"></div><div class="actions"><button onclick="changePw()">Change password</button></div></div>');
}
function changePw() {
  var o = $('pw_o').value, n = $('pw_n').value, c = $('pw_c').value;
  if (n.length < 6) return setErr('New password must be at least 6 characters.');
  if (n !== c) return setErr('The new passwords do not match.');
  busy(true);
  api('changePassword', { oldPassword: o, newPassword: n }).then(function () { busy(false); setOk('Password changed.'); $('pw_o').value = $('pw_n').value = $('pw_c').value = ''; })
    .catch(function (e) { fail(e); });
}

// ------------------------------------------------------------ counselor
function pStudents() {
  busy(true);
  api('listStudents').then(function (list) { busy(false); CS.list = list; drawStudents(); }).catch(function (e) { fail(e); });
}
function drawStudents() {
  var q = CS.search.toLowerCase();
  var list = CS.list.filter(function (s) {
    return (CS.filter === 'ALL' || s.strand === CS.filter) &&
      (!q || (s.name + ' ' + s.school + ' ' + s.town).toLowerCase().indexOf(q) !== -1);
  });
  var count = function (st) { return CS.list.filter(function (s) { return s.status === st; }).length; };
  render('<div class="hero">' + avatar(PHOTO, USER.name, 'xl') + '<div style="position:relative;z-index:1"><h1>Hi, ' + esc(USER.name.split(' ')[0]) + '! 👋</h1>' +
    '<div class="who"><span><b>' + esc(USER.name) + '</b></span><span>Guidance counselor</span><span>@' + esc(USER.username) + '</span>' +
    (FS.verified ? '<span class="vpill">' + icon('check') + 'Face verified</span>' : '') + '</div><p style="margin:0">Review results and endorse a course for each student.</p></div></div>' +
    '<h1>Students</h1>' +
    '<div class="stats"><div class="stat"><b>' + CS.list.length + '</b><span>students</span></div><div class="stat"><b>' + count('Endorsed') + '</b><span>endorsed</span></div>' +
    '<div class="stat"><b>' + count('Pending') + '</b><span>pending</span></div></div>' +
    '<div class="card"><div class="grid2"><div><label for="f_s" style="margin-top:0">Strand or track</label><select id="f_s" onchange="CS.filter=this.value;drawStudents()">' +
    options(['ALL'].concat(CFG.strands), CS.filter) + '</select></div><div><label for="f_q" style="margin-top:0">Search name, school, or town</label><input id="f_q" value="' + esc(CS.search) +
    '" placeholder="Type and press Enter" onkeydown="if(event.key===\'Enter\'){CS.search=this.value;drawStudents()}"></div></div>' +
    '<div class="actions"><button class="sec" onclick="CS.search=val(\'f_q\');drawStudents()">Search</button><button class="sec" onclick="pStudents()">' + icon('refresh') + 'Refresh</button></div></div>' +
    '<div class="card" style="padding:0;overflow:hidden">' + (list.length ? '<div style="overflow-x:auto"><table><tr><th>Student</th><th class="hide-m">Strand</th><th class="hide-m">Steps</th><th>Top course</th><th>Status</th></tr>' +
    list.map(function (s) {
      return '<tr class="click" onclick="openStudent(\'' + esc(s.userId) + '\')"><td><b>' + esc(s.name) + '</b><br><span class="small muted">' + esc(s.school) + (s.town ? ' · ' + esc(s.town) : '') +
        '</span></td><td class="hide-m">' + esc(s.strand) + '</td><td class="hide-m">' + s.done + '/5</td><td>' + (s.topProgram ? esc(s.topProgram) + ' <span class="muted">(' + s.topScore + ')</span>' : '<span class="muted">–</span>') +
        '</td><td><span class="pill ' + esc(String(s.status).split(' ')[0]) + '">' + esc(s.status) + '</span></td></tr>';
    }).join('') + '</table></div>' : '<div class="empty">' + icon('users') + '<p>No students yet.</p></div>') + '</div>');
}
function openStudent(id) {
  busy(true);
  api('getStudent', { userId: id }).then(function (R) { busy(false); CS.student = R; PAGE = 'student'; drawTop(); drawStudent(); }).catch(function (e) { fail(e); });
}
function drawStudent() {
  var R = CS.student, e = R.endorsement;
  var o = townPoint(R.profile ? R.profile.town : '') || myOrigin();
  render('<div class="head"><div style="display:flex;align-items:center;gap:14px">' + avatar(R.photo, R.name, 'md') + '<div><a class="small" onclick="go(\'students\')">← All students</a><h1 style="margin:0">' + esc(R.name) + '</h1></div></div>' +
    '<div class="actions noprint" style="margin:0">' + (R.recommendation ? '<button class="sec" onclick="downloadPdf(\'' + esc(R.userId) + '\')">' + icon('download') + 'PDF</button>' : '') +
    '<button class="sec" onclick="window.print()">' + icon('print') + 'Print</button></div></div>' +
    '<div class="card"><h2>Counselor decision</h2><div class="grid2"><div><label for="e_st">Status</label><select id="e_st">' +
    options(['Pending', 'Endorsed', 'Needs Revision'], e.status) + '</select></div><div><label for="e_pg">Endorsed program</label><select id="e_pg" onchange="previewEndorse(this.value)">' +
    options(CFG.programs, e.program, 'Choose…') + '</select></div></div><div id="endPreview" class="small muted" style="margin-top:8px"></div>' +
    '<label for="e_nt">Notes for the student</label><textarea id="e_nt" maxlength="1000">' + esc(e.notes) + '</textarea>' +
    '<p class="small muted">Before endorsing, check any NCAE/PACT results against the student’s certificate and talk with the student.</p>' +
    '<div id="err" class="err"></div><div class="actions"><button onclick="saveEndorse()">Save decision</button></div></div>' +
    '<div class="card noprint"><h2>' + icon('face') + ' Sign-in help</h2><p class="small muted" style="margin-top:-6px">Face scan: <b>' + (R.face ? 'saved' : 'not set up yet') + '</b>. ' +
    'If the student can no longer pass the face scan (new phone, injury, big change in looks), reset it. This also removes their saved Face ID / fingerprint devices. ' +
    'They sign in with their password and scan their face again.</p><div id="rfErr" class="err"></div>' +
    '<div class="actions"><button class="danger" onclick="resetStudentFace(\'' + esc(R.userId) + '\')">Reset face scan</button></div></div>' +
    (e.status === 'Endorsed' ? endorsedCard(e, o, 'c-end', 4) : '') +
    recordSummary(R) + (R.recommendation ? recCards(R.recommendation, o, 'c-', e) : '<div class="card empty">' + icon('star') + '<p>This student has no recommendations yet.</p></div>'));
  previewEndorse(e.program);
  REDRAW = drawStudent;
}
function resetStudentFace(id) {
  if (!confirm('Reset this student\'s face scan and saved devices? Only do this after checking it is really the student asking.')) return;
  busy(true);
  api('resetFace', { userId: id }).then(function () { busy(false); CS.student.face = false; drawStudent(); toast('Face scan reset ✓'); })
    .catch(function (e) { fail(e, 'rfErr'); });
}
function previewEndorse(code) {
  var el = $('endPreview'); if (!el) return;
  if (!code) { el.textContent = ''; return; }
  var R = CS.student, o = townPoint(R.profile ? R.profile.town : '') || myOrigin(), list = schoolsFor(code, o);
  var near = list.filter(function (s) { return s.km !== null && s.km <= CFG.nearbyKm; });
  el.innerHTML = icon('school') + ' ' + list.length + ' school' + (list.length === 1 ? '' : 's') + ' offer ' + esc(code) + '; ' + near.length + ' within ' + CFG.nearbyKm + ' km of ' + esc(originText(o)) +
    (list[0] ? ' (nearest: ' + esc(list[0].name + (list[0].campus ? ' – ' + list[0].campus : '')) + ', ~' + Math.round(list[0].km) + ' km).' : '.');
}
function saveEndorse() {
  var d = { userId: CS.student.userId, status: val('e_st'), program: val('e_pg'), notes: val('e_nt') };
  if (d.status === 'Endorsed' && !d.program) return setErr('Please choose the program to endorse.');
  busy(true);
  api('endorse', d).then(function (R) { busy(false); R.photo = CS.student.photo; CS.student = R; drawStudent(); toast('Decision saved ✓'); }).catch(function (e) { fail(e); });
}

// ------------------------------------------------------------ start
(function start() {
  busy(true);
  LOC = loadJson('cm_loc');
  api('config').then(function (c) {
    CFG = c;
    return faceInit();
  }).then(function () {
    TOKEN = load('cm_token');
    if (!FACE.here && CFG.appUrl && CFG.faceRequired) { busy(false); return showLauncher(); }
    if (FACE.here && inAppBrowser()) { busy(false); return showOpenOutside(); }
    if (TOKEN && verifyReady()) {
      // On the app page, opening the app always asks for Face ID / fingerprint, even if you are still signed in.
      return api('me').then(function (m) { busy(false); PENDING = m.user; faceStep(m.pending ? 'verify' : 'verify'); }).catch(function (e) { fail(e); });
    }
    if (TOKEN) return loadMe();
    busy(false); showAuth('login');
  }).catch(function (e) {
    busy(false);
    render('<div class="card err">Could not load CourseMatch: ' + esc(e.message) + '<br>Did you run setup() in the script editor?</div>');
  });
})();
</script>
</body>
</html>
